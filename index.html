<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Диски и шины в Томске</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f3f4f2; --surface:#fff; --ink:#1b1f23; --muted:#5d656d; --line:#dfe2df;
  --accent:#2c5b86; --accent-soft:#e3ecf4; --ok:#2f7a4f; --ok-soft:#e2f1e7; --warn:#8a5a14; --warn-soft:#f6ecd9;
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#14171a; --surface:#1c2024; --ink:#e8ebee; --muted:#9aa3ab; --line:#2c3238;
  --accent:#7fb0dc; --accent-soft:#1e2d3b; --ok:#7cc79a; --ok-soft:#1b2e23; --warn:#e0b366; --warn-soft:#33291a;}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#14171a; --surface:#1c2024; --ink:#e8ebee; --muted:#9aa3ab; --line:#2c3238;
  --accent:#7fb0dc; --accent-soft:#1e2d3b; --ok:#7cc79a; --ok-soft:#1b2e23; --warn:#e0b366; --warn-soft:#33291a;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between;padding-top:18px;padding-bottom:18px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px}
.contacts{display:flex;gap:16px;font-size:14px}
nav.tabs{display:flex;gap:4px;margin:24px 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{font:inherit;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{display:none}.panel.on{display:block}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:120px;flex:1 1 140px}
input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;padding-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip small{font-weight:400;opacity:.75}
.carinfo{margin:16px 0 4px;font-size:14px;color:var(--muted)}
.carinfo b{color:var(--ink);font-weight:600}
.note{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px;margin:8px 0}
h2{font-size:18px;margin:24px 0 8px}
.count{color:var(--muted);font-weight:400;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card .img{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--bg);display:block}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .t{font-weight:600;font-size:15px;line-height:1.3}
.card .spec{font-size:13px;color:var(--muted)}
.card .price{font-size:20px;font-weight:700;margin-top:auto}
.card .price small{font-size:12px;font-weight:400;color:var(--muted)}
.badge{align-self:flex-start;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.order{background:var(--warn-soft);color:var(--warn)}
.card a.go{font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;color:var(--ink)}
.card a.go:hover{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--muted);padding:24px 0}
.more{display:block;margin:16px auto;font:inherit;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 20px;cursor:pointer;color:var(--ink)}
footer{margin-top:48px;border-top:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
footer .wrap{padding-top:20px;padding-bottom:28px;display:grid;gap:6px}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:10px}.card .body{padding:10px}.card .price{font-size:17px}h1{font-size:19px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div><h1 id="shop"></h1><div class="sub" id="shopsub"></div></div>
  <div class="contacts" id="contacts"></div>
</div></header>
<main class="wrap">
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="car" aria-selected="true">Подбор по машине</button>
    <button role="tab" data-tab="discs" aria-selected="false">Диски</button>
    <button role="tab" data-tab="tyres" aria-selected="false">Шины</button>
  </nav>

  <section class="panel on" id="p-car">
    <div class="filters">
      <label class="f">Марка<select id="make"></select></label>
      <label class="f">Модель<select id="model"></select></label>
    </div>
    <div id="carout"></div>
  </section>

  <section class="panel" id="p-discs">
    <div class="filters">
      <label class="f">Диаметр<select id="dd"></select></label>
      <label class="f">Сверловка<select id="dp"></select></label>
      <label class="f">Ширина<select id="dw"></select></label>
      <label class="f">Вылет ET от<input id="de1" type="number" inputmode="numeric" placeholder="любой"></label>
      <label class="f">Вылет ET до<input id="de2" type="number" inputmode="numeric" placeholder="любой"></label>
      <label class="f">ЦО ступицы машины<select id="dc"></select></label>
      <label class="chk"><input type="checkbox" id="ds"> только в наличии</label>
    </div>
    <h2>Диски <span class="count" id="dcount"></span></h2>
    <div class="grid" id="dgrid"></div><button class="more" id="dmore" hidden>Показать ещё</button>
  </section>

  <section class="panel" id="p-tyres">
    <div class="filters">
      <label class="f">Ширина<select id="tw"></select></label>
      <label class="f">Профиль<select id="th"></select></label>
      <label class="f">Диаметр<select id="td"></select></label>
      <label class="f">Сезон<select id="tse"><option value="">любой</option><option value="winter">зимние</option><option value="summer">летние</option><option value="all">всесезонные / AT / MT</option></select></label>
      <label class="chk"><input type="checkbox" id="ts"> только в наличии</label>
    </div>
    <h2>Шины <span class="count" id="tcount"></span></h2>
    <div class="grid" id="tgrid"></div><button class="more" id="tmore" hidden>Показать ещё</button>
  </section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const S = D.shop, byId = Object.fromEntries(D.items.map(i => [i.id, i]));
const $ = id => document.getElementById(id);
const rub = n => n.toLocaleString('ru-RU') + ' ₽';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural = (n, a, b, c) => n % 10 === 1 && n % 100 !== 11 ? a : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? b : c;
const SEASON = {winter: 'зимние', summer: 'летние', all: 'всесезонные'};

$('shop').textContent = S.name + ' ' + S.city_in;
$('shopsub').textContent = `Новые диски и шины · в наличии и под заказ · обновлено ${S.updated}`;
$('contacts').innerHTML = [`<a href="${S.drom}" target="_blank" rel="noopener">Все объявления на Дроме</a>`,
  S.vk && `<a href="${S.vk}" target="_blank" rel="noopener">Группа ВКонтакте</a>`].filter(Boolean).join('');
$('foot').innerHTML = [
  'Цены — за комплект из 4 штук. «Под заказ» — предоплата ' + esc(S.prepay) + ', срок зависит от поставщика.',
  S.pickup && esc(S.pickup),
  'Подбор по машине — рекомендательный: перед шиномонтажом лучше примерить. Сомневаетесь — напишите, проверим по вашей машине.',
  'Отправляем в другие города транспортными компаниями.'].filter(Boolean).map(x => `<div>${x}</div>`).join('');

function card(i, extra) {
  const spec = i.k === 'd'
    ? `${i.w}×${i.d}″ · ${i.pcd.join(', ')} · ET${i.et} · ЦО ${i.cb}`
    : [i.sz, SEASON[i.se], i.st ? 'шипы' : '', i.y && i.y + ' г.'].filter(Boolean).join(' · ');
  return `<article class="card">
    <a class="img" href="${i.u}" target="_blank" rel="noopener">${i.ph ? `<img src="${i.ph}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}</a>
    <div class="body">
      <span class="badge ${i.s ? 'ok' : 'order'}">${i.s ? 'в наличии ' + esc(S.city_in) : 'под заказ'}</span>
      <div class="t">${esc(i.t)}</div>
      <div class="spec">${esc(spec)}${extra ? '<br>' + extra : ''}</div>
      <div class="price">${rub(i.p)} <small>за 4 шт.</small></div>
      <a class="go" href="${i.u}" target="_blank" rel="noopener">Смотреть и написать на Дроме</a>
    </div></article>`;
}

function paged(list, grid, more, extraFn) {
  let shown = 0;
  const step = () => { grid.insertAdjacentHTML('beforeend', list.slice(shown, shown + 24).map(i => card(i, extraFn && extraFn(i))).join('')); shown += 24; more.hidden = shown >= list.length; };
  grid.innerHTML = ''; more.onclick = step; step();
  if (!list.length) { grid.innerHTML = '<div class="empty">Ничего не нашлось — напишите нам, привезём под заказ.</div>'; more.hidden = true; }
}
const sortItems = l => l.sort((a, b) => b.s - a.s || a.p - b.p);
const fill = (sel, values, all) => { sel.innerHTML = (all ? `<option value="">${all}</option>` : '') + values.map(v => `<option value="${esc(v[0])}">${esc(v[1])}</option>`).join(''); };

// --- вкладки ---
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + b.dataset.tab));
  history.replaceState(null, '', '#' + b.dataset.tab);
});

// --- подбор по машине ---
const makes = [...new Set(D.cars.map(c => c.make))].sort();
fill($('make'), makes.map(m => [m, m]), 'выберите марку');
const carName = c => [c.model, c.gen, c.years && `(${c.years})`].filter(Boolean).join(' ');
$('make').onchange = () => {
  const list = D.cars.map((c, i) => [i, c]).filter(([, c]) => c.make === $('make').value);
  fill($('model'), list.map(([i, c]) => [i, carName(c)]), list.length ? 'выберите модель' : '—');
  $('carout').innerHTML = '';
};
$('model').onchange = () => showCar($('model').value);
function showCar(idx, diam) {
  const c = D.cars[idx]; if (!c) { $('carout').innerHTML = ''; return; }
  const ds = Object.keys(c.fits).map(Number).sort((a, b) => a - b);
  const d = diam && c.fits[diam] ? diam : (ds.find(x => c.fits[x].discs.length) || ds[0]);
  const f = c.fits[d];
  const discs = sortItems(f.discs.map(id => byId[id]).filter(Boolean));
  const tyres = sortItems(D.items.filter(i => i.k === 't' && f.tyres.includes(i.sz)));
  const rings = new Set(f.rings);
  $('carout').innerHTML = `
    <div class="carinfo"><b>${esc(c.make)} ${esc(carName(c))}</b> · сверловка <b>${esc(c.pcd)}</b> · центральное отверстие <b>${esc(c.cb)}</b> мм · ширина диска ${esc(c.w)}″ · вылет ET ${esc(c.et)} · заводские шины ${esc(c.oem.join(', '))}</div>
    ${c.sure ? '' : '<div class="note">Параметры этой машины ещё не перепроверены — перед покупкой напишите нам, сверим по году и комплектации.</div>'}
    <div class="chips" id="dchips">${ds.map(x => `<button class="chip" data-d="${x}" aria-pressed="${x === d}">R${x} <small>${c.fits[x].discs.length ? c.fits[x].discs.length + ' ' + plural(c.fits[x].discs.length, 'диск', 'диска', 'дисков') : 'шины'}</small></button>`).join('')}</div>
    <h2>Диски R${d} <span class="count">${discs.length ? discs.length + ' — встанут на вашу машину' : 'в каталоге нет — привезём под заказ'}</span></h2>
    <div class="grid" id="cdgrid"></div><button class="more" id="cdmore" hidden>Показать ещё</button>
    <h2>Шины R${d} <span class="count">${f.tyres.length ? 'подходят размеры: ' + f.tyres.join(', ') : ''}</span></h2>
    <div class="grid" id="ctgrid"></div><button class="more" id="ctmore" hidden>Показать ещё</button>`;
  document.querySelectorAll('#dchips .chip').forEach(b => b.onclick = () => showCar(idx, +b.dataset.d));
  if (discs.length) paged(discs, $('cdgrid'), $('cdmore'), i => rings.has(i.id) ? 'ставятся с центровочными кольцами' : 'садится точно по ступице');
  else $('cdgrid').innerHTML = '';
  if (f.tyres.length) paged(tyres, $('ctgrid'), $('ctmore'));
  history.replaceState(null, '', `#car=${idx}&d=${d}`);
}

// --- диски ---
const discsAll = D.items.filter(i => i.k === 'd');
fill($('dd'), [...new Set(discsAll.map(i => +i.d))].sort((a, b) => a - b).map(d => [d, 'R' + d]), 'все');
fill($('dp'), [...new Set(discsAll.flatMap(i => i.pcd))].sort().map(p => [p, p]), 'все');
const nums = s => String(s).split('/').map(Number).filter(x => !isNaN(x));
fill($('dw'), [...new Set(discsAll.flatMap(i => nums(i.w)))].sort((a, b) => a - b).map(w => [w, w + '″']), 'все');
fill($('dc'), [...new Set(discsAll.map(i => +i.cb).filter(Boolean))].sort((a, b) => a - b).map(c => [c, c + ' мм']), 'любой');
const showDiscs = () => {
  const w = +$('dw').value, e1 = $('de1').value === '' ? -99 : +$('de1').value, e2 = $('de2').value === '' ? 99 : +$('de2').value, hub = +$('dc').value;
  const l = sortItems(discsAll.filter(i => (!$('dd').value || i.d == $('dd').value) && (!$('dp').value || i.pcd.includes($('dp').value))
    && (!w || nums(i.w).includes(w)) && nums(i.et).some(e => e >= e1 && e <= e2) && (!hub || +i.cb >= hub) && (!$('ds').checked || i.s)));
  $('dcount').textContent = l.length;
  paged(l, $('dgrid'), $('dmore'), hub ? i => Math.abs(+i.cb - hub) < 0.05 ? 'садится точно по ступице' : `с центровочными кольцами ${i.cb}→${hub}` : null);
};
['dd', 'dp', 'dw', 'dc', 'ds'].forEach(id => $(id).onchange = showDiscs);
['de1', 'de2'].forEach(id => $(id).oninput = showDiscs);

// --- шины ---
const tyresAll = D.items.filter(i => i.k === 't'), parts = i => (i.sz.match(/^(\d{3})\/(\d{2})R(\d{2})$/) || []).slice(1);
const uniq = n => [...new Set(tyresAll.map(i => parts(i)[n]).filter(Boolean))].sort((a, b) => a - b);
fill($('tw'), uniq(0).map(v => [v, v]), 'все'); fill($('th'), uniq(1).map(v => [v, v]), 'все'); fill($('td'), uniq(2).map(v => [v, 'R' + v]), 'все');
const showTyres = () => {
  const [w, h, d] = ['tw', 'th', 'td'].map(id => $(id).value);
  const l = sortItems(tyresAll.filter(i => { const p = parts(i); return (!w || p[0] === w) && (!h || p[1] === h) && (!d || (p[2] || i.sz.slice(-2)) === d)
    && (!$('tse').value || i.se === $('tse').value) && (!$('ts').checked || i.s); }));
  $('tcount').textContent = l.length; paged(l, $('tgrid'), $('tmore'));
};
['tw', 'th', 'td', 'tse', 'ts'].forEach(id => $(id).onchange = showTyres);

showDiscs(); showTyres();
function route() {
  const h = new URLSearchParams(location.hash.slice(1)), tab = location.hash.slice(1);
  if (h.has('car') && D.cars[h.get('car')]) {
    document.querySelector('[data-tab="car"]').click();
    const c = D.cars[h.get('car')]; $('make').value = c.make; $('make').onchange(); $('model').value = h.get('car'); showCar(h.get('car'), +h.get('d'));
  } else if (['car', 'discs', 'tyres'].includes(tab)) document.querySelector(`[data-tab="${tab}"]`).click();
}
window.addEventListener('hashchange', route); route();
</script>
<script src="https://circumstances-assumed-plastics-delhi.trycloudflare.com/widget.js" defer></script>
